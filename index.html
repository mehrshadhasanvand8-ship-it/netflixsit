<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرشیو فیلم و سریال</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #e50914;
        }

        header h1 {
            color: #e50914;
            font-size: 26px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .loading {
            text-align: center;
            font-size: 18px;
            color: #aaa;
            margin-top: 50px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
            color: #fff;
        }

        .movie-date {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .download-btn {
            background-color: #e50914;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background-color: #f40612;
        }

        .empty-state {
            text-align: center;
            color: #888;
            font-size: 16px;
            grid-column: 1 / -1;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎥 آرشیو فیلم و سریال کانال</h1>
    </header>

    <div class="container">
        <div id="loading" class="loading">در حال بارگذاری فیلم‌ها...</div>
        <div id="movies-container" class="movies-grid"></div>
    </div>

    <script>
        async function fetchMovies() {
            const container = document.getElementById('movies-container');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                
                loading.style.display = 'none';
                container.innerHTML = '';

                if (movies.length === 0) {
                    container.innerHTML = '<div class="empty-state">هنوز فیلمی در آرشیو ثبت نشده است.</div>';
                    return;
                }

                movies.forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    
                    card.innerHTML = `
                        <div>
                            <div class="movie-title">${escapeHtml(movie.title)}</div>
                            <div class="movie-date">تاریخ ثبت: ${new Date(movie.date).toLocaleDateString('fa-IR')}</div>
                        </div>
                        <a href="https://t.me/" target="_blank" class="download-btn">مشاهده در تلگرام</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                loading.textContent = 'خطا در دریافت اطلاعات از سرور!';
                console.error('خطا:', error);
            }
        }

        // تابع امنیتی کوچک برای جلوگیری از خطاهای کدهای مخرب احتمالی در متن
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // اجرای تابع هنگام باز شدن صفحه
        fetchMovies();
    </script>
</body>
</html>
