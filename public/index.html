<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آرشیو فیلم و سریال</title>
    <style>
        body {
            background-color: #141414;
            color: #fff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #e50914;
        }
        h1 {
            color: #e50914;
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 10px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .movie-card h3 {
            margin-top: 0;
            font-size: 18px;
        }
        video {
            width: 100%;
            border-radius: 6px;
            outline: none;
            background: #000;
        }
        .no-movie {
            text-align: center;
            color: #888;
            margin-top: 50px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 آرشیو فیلم و سریال کانال</h1>
    </header>

    <div class="container" id="movie-list">
        <div class="no-movie">در حال بارگذاری آرشیو...</div>
    </div>

    <script>
        async function fetchMovies() {
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();
                const container = document.getElementById('movie-list');

                if (movies.length === 0) {
                    container.innerHTML = '<div class="no-movie">هنوز فیلمی در آرشیو ثبت نشده است.</div>';
                    return;
                }

                container.innerHTML = '';
                movies.reverse().forEach(movie => {
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <h3>${movie.title}</h3>
                        <video controls preload="metadata">
                            <source src="${movie.videoUrl}" type="video/mp4">
                            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
                        </video>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error fetching movies:', error);
            }
        }

        fetchMovies();
        setInterval(fetchMovies, 10000); // هر ۱۰ ثانیه لیست رو آپدیت می‌کنه
    </script>
</body>
</html>
